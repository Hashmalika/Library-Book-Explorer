services:
  - type: web
    name: library-book-backend
    env: python
    plan: free
    buildCommand: ""
    startCommand: gunicorn app:app
    rootDir: backend
    envVars:
      - key: DB_HOST
        value: localhost
      - key: DB_USER
        value: root
      - key: DB_PASSWORD
        value: Hash@sql1416
      - key: DB_NAME
        value: library
      - key: FLASK_DEBUG
        value: false
